<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ZSAD Fabric Inspector</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0a0a0a;
    color: #fff;
    text-align: center;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
  }
  h1 { font-size: 24px; margin: 20px 0 4px; color: #00e676; letter-spacing: 1px; }
  .subtitle { font-size: 14px; color: #888; margin-bottom: 24px; }

  .preview-box {
    width: 100%;
    max-width: 400px;
    aspect-ratio: 1/1;
    background: #1a1a1a;
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    margin-bottom: 20px;
    border: 2px dashed #333;
  }
  .preview-box img { width: 100%; height: 100%; object-fit: cover; }
  .placeholder { color: #555; font-size: 14px; }
  .placeholder .icon { font-size: 48px; display: block; margin-bottom: 12px; }

  .camera-btn {
    background: #00e676; color: #000; border: none;
    padding: 16px 32px; font-size: 18px; font-weight: 600;
    border-radius: 50px; width: 100%; max-width: 400px;
    margin-bottom: 12px; cursor: pointer; transition: all 0.2s;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .camera-btn:active { transform: scale(0.96); }
  .camera-btn:disabled { background: #333; color: #666; }
  #file-input { display: none; }

  #status { font-size: 13px; color: #888; margin-bottom: 16px; min-height: 20px; }

  .spinner {
    display: inline-block; width: 18px; height: 18px;
    border: 3px solid #555; border-top-color: #00e676;
    border-radius: 50%; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  #result { width: 100%; max-width: 400px; display: none; }
  #result.show { display: block; }

  .verdict-badge {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 12px 24px; border-radius: 16px;
    font-size: 20px; font-weight: 800; margin-bottom: 8px;
  }
  .verdict-badge.safe { background: #00e676; color: #000; }
  .verdict-badge.warning { background: #ffc107; color: #000; }
  .verdict-badge.defect { background: #ff1744; color: #fff; }

  .defect-type {
    display: inline-block;
    background: #ff1744;
    color: #fff;
    padding: 8px 20px;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 16px;
    text-transform: capitalize;
  }
  .defect-conf {
    font-size: 12px;
    opacity: 0.7;
    margin-left: 6px;
  }

  .score-row {
    display: flex; justify-content: space-between;
    background: #1a1a1a; padding: 14px 20px;
    border-radius: 12px; margin-bottom: 10px;
  }
  .score-label { color: #888; font-size: 14px; }
  .score-value { font-weight: 700; font-size: 20px; }

  #heatmap { width: 100%; border-radius: 12px; margin-top: 10px; border: 2px solid #333; }

  .instructions {
    font-size: 13px; color: #555; margin-top: 16px;
    line-height: 1.6; max-width: 400px;
  }
</style>
</head>
<body>

<h1>ZSAD Inspector</h1>
<div class="subtitle">AI fabric defect detector</div>

  <div class="preview-box">
    <div class="placeholder" id="placeholder">
      <span class="icon">📷</span>Tap below to inspect
    </div>
    <img id="preview" style="display:none" alt="Photo">
  </div>

  <div style="display:flex; gap:10px; width:100%; max-width:400px;">
    <button class="camera-btn" id="capture-btn" style="flex:1">Take Photo</button>
    <button class="camera-btn" id="gallery-btn" style="flex:1; background:#555;">Upload</button>
  </div>
  <input type="file" id="camera-input" accept="image/*" capture="environment">
  <input type="file" id="gallery-input" accept="image/*">
  <div id="status">Ready</div>

<div id="result">
  <div id="verdict-area"></div>
  <div id="defect-type-area"></div>
  <div class="score-row">
    <span class="score-label">Anomaly Score</span>
    <span class="score-value" id="img-score">—</span>
  </div>
  <img id="heatmap" alt="Heatmap">
</div>

<div class="instructions">
  <strong>How it works:</strong><br>
  1 Tap "Take Photo" (camera) or "Upload" (gallery)<br>
  2 Point at fabric and capture or select image<br>
  3 Green = normal, Red = defect with name<br>
  4 White areas on heatmap show where
</div>

<script>
const cameraInput = document.getElementById('camera-input');
const galleryInput = document.getElementById('gallery-input');
const captureBtn = document.getElementById('capture-btn');
const galleryBtn = document.getElementById('gallery-btn');
const preview = document.getElementById('preview');
const placeholder = document.getElementById('placeholder');
const status = document.getElementById('status');
const resultDiv = document.getElementById('result');
const imgScore = document.getElementById('img-score');
const heatmap = document.getElementById('heatmap');
const verdictArea = document.getElementById('verdict-area');
const defectTypeArea = document.getElementById('defect-type-area');

captureBtn.addEventListener('click', () => cameraInput.click());
galleryBtn.addEventListener('click', () => galleryInput.click());

function compressImage(file, maxDim) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if (Math.max(w, h) > maxDim) {
          const s = maxDim / Math.max(w, h);
          w = Math.round(w * s); h = Math.round(h * s);
        }
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        c.toBlob(b => resolve(b), 'image/jpeg', 0.8);
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}

async function handleFile(e) {
  const file = e.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = (ev) => {
    preview.src = ev.target.result;
    preview.style.display = 'block';
    placeholder.style.display = 'none';
  };
  reader.readAsDataURL(file);

  captureBtn.disabled = true;
  captureBtn.innerHTML = '<span class="spinner"></span> Analyzing...';
  status.textContent = 'Analyzing...';
  defectTypeArea.innerHTML = '';

  const compressed = await compressImage(file, 640);
  const fd = new FormData();
  fd.append('file', compressed, 'capture.jpg');

  try {
    const resp = await fetch('/predict', { method: 'POST', body: fd });
    const data = await resp.json();
    resultDiv.classList.add('show');

    if (data.is_anomaly) {
      let badgeClass = data.severity === 'high' ? 'defect' : 'warning';
      let badgeText = data.severity === 'high' ? 'DEFECT DETECTED' : 'POSSIBLE DEFECT';
      verdictArea.innerHTML = `<div class="verdict-badge ${badgeClass}">${badgeText}</div>`;

      if (data.defect_name) {
        const isSev = ['low','medium','high'].includes(data.defect_name);
        const pct = data.defect_confidence ? (data.defect_confidence * 100).toFixed(0) : '';
        const label = isSev ? data.defect_name.toUpperCase() + ' SEVERITY' : data.defect_name.replace('_','/');
        defectTypeArea.innerHTML = `<div class="defect-type">${label}${pct ? ' <span class="defect-conf">'+pct+'%</span>' : ''}</div>`;
      }
    } else {
      const gn = data.defect_name || 'Good Fabric';
      verdictArea.innerHTML = `<div class="verdict-badge safe">${gn}</div>`;
    }

    imgScore.textContent = data.img_score.toFixed(4);
    heatmap.src = 'data:image/png;base64,' + data.score_map_png_base64;
    status.textContent = 'Done';
  } catch (err) {
    status.textContent = 'Error: ' + err.message;
  }

  captureBtn.disabled = false;
  captureBtn.innerHTML = 'Take Photo';
  cameraInput.value = '';
  galleryInput.value = '';
}

cameraInput.addEventListener('change', handleFile);
galleryInput.addEventListener('change', handleFile);
</script>
</body>
</html>
